server:
  port: 8084
spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/appdb?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
app:
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  dashboard:
    currency: ${APP_DASHBOARD_CURRENCY:USD}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
