server:
  port: 8081
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/appdb?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
  dashboard:
    currency: ${APP_DASHBOARD_CURRENCY:USD}
    zone: ${APP_DASHBOARD_ZONE:Asia/Kolkata}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
