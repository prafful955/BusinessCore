server:
  port: 8081
spring:
  cloud:
    config:
      name: "${spring.application.name},database"
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
  dashboard:
    currency: ${APP_DASHBOARD_CURRENCY:USD}
    zone: ${APP_DASHBOARD_ZONE:Asia/Kolkata}
