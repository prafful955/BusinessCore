server:
  port: 8085
spring:
  cloud:
    config:
      name: "${spring.application.name},database"
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: sales-invoice-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
app:
  auth:
    enabled: ${APP_AUTH_ENABLED:false}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  dashboard:
    currency: ${APP_DASHBOARD_CURRENCY:USD}
