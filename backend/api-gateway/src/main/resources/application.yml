server:
  port: 8080
spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 3s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: employees
          uri: lb://user-service
          predicates:
            - Path=/api/employees,/api/employees/**
          filters:
            - name: CircuitBreaker
              args:
                name: employeeGatewayCircuit
                fallbackUri: forward:/fallback/employee
                statusCodes: [500, 502, 503, 504]
        - id: users
          uri: lb://user-service
          predicates: [Path=/api/users/**]
        - id: products
          uri: lb://product-service
          predicates: [Path=/api/products/**]
        - id: orders
          uri: lb://order-service
          predicates: [Path=/api/orders/**]

        - id: employee-management
          uri: lb://user-service
          predicates:
            - Path=/api/roles,/api/roles/**,/api/auth/**,/api/departments,/api/locations,/api/cash-registers,/api/email-accounts,/api/work-shifts,/api/holiday-schedules,/api/dashboard/**

        - id: customers-and-documents
          uri: lb://user-service
          predicates:
            - Path=/api/customers,/api/customers/**,/api/quotations,/api/quotations/**,/api/invoices,/api/invoices/**,/api/statuses,/api/lookup-values,/api/lookup-values/**

        - id: categories
          uri: lb://product-service
          predicates:
            - Path=/api/categories,/api/categories/**

        - id: organizations-and-inventory
          uri: lb://inventory-service
          predicates:
            - Path=/api/warehouses,/api/companies,/api/companies/**,/api/business-locations,/api/business-locations/**,/api/warehouses/**,/api/stocks,/api/stocks/**,/api/stock-products,/api/purchase-orders,/api/purchase-orders/**,/api/purchases,/api/purchases/**,/api/stock-transfers,/api/stock-transfers/**

        - id: sales-invoices
          uri: lb://sales-invoice-service
          predicates:
            - Path=/api/sales-invoices,/api/sales-invoices/**
        - id: customer-orders
          uri: lb://user-service
          predicates:
            - Path=/api/sales-orders,/api/sales-orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,gateway,prometheus
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      employeeGatewayCircuit:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
  timelimiter:
    instances:
      employeeGatewayCircuit:
        timeout-duration: 4s

---
# Integration tests use a local upstream and do not need Config Server.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
