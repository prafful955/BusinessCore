server:
  port: 8082
spring:
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: product-service
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
